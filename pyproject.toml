[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arpa"
version = "0.1.0"
description = "Arpa W1 first-slice — agent platform control plane + LangGraph runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Arpa", email = "dev@arpa.local" }]
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.0,<0.40",
  "sqlalchemy[asyncio]>=2.0.35,<2.1",
  "alembic>=1.13.0,<1.17",
  "asyncpg>=0.29.0,<0.31",
  "psycopg[binary,pool]>=3.2.0,<3.3",
  "pyjwt[crypto]>=2.9.0,<3",
  "httpx>=0.27.0,<0.29",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.5.0,<3",
  "langgraph>=0.2.40,<2",
  "langgraph-checkpoint>=2.0.0,<4",
  "langgraph-checkpoint-postgres>=2.0.0,<4",
  "langchain-core>=0.3.0,<2",
  "langchain-openrouter>=0.0.1,<0.3",
  "python-multipart>=0.0.9,<0.1",
  "sse-starlette>=2.1.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<1",
  "anyio>=4.6.0,<5",
  "aiosqlite>=0.20.0,<1",
]

[tool.setuptools.packages.find]
where = [
  "packages/control_plane",
  "packages/workflows",
  "packages/gateway",
  "packages/tools",
  "packages/db",
  "packages/ar",
  "packages/evals",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
  "packages/control_plane",
  "packages/workflows",
  "packages/gateway",
  "packages/tools",
  "packages/db",
  "packages/ar",
  "packages/evals",
]
