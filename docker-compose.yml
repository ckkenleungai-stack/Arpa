services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: arpa
      POSTGRES_PASSWORD: arpa
      POSTGRES_DB: arpa
    ports:
      - "5432:5432"
    volumes:
      - arpa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arpa -d arpa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://arpa:arpa@postgres:5432/arpa
      DATABASE_URL_SYNC: postgresql://arpa:arpa@postgres:5432/arpa
      ALLOWED_ROOT: /app/workspace_data
    ports:
      - "8000:8000"
    volumes:
      - ./workspace_data:/app/workspace_data
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic -c packages/db/db/alembic.ini upgrade head &&
             uvicorn control_plane.main:app --host 0.0.0.0 --port 8000"

volumes:
  arpa_pgdata:
